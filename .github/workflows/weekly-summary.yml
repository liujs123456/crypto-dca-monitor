name: Weekly Summary

on:
  schedule:
    - cron: '30 4 * * 1'  # Sun 21:30 PT in PDT
    - cron: '30 5 * * 1'  # Sun 21:30 PT in PST
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass DST gate'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: prelude
        uses: ./.github/actions/cron-prelude
        with:
          pdt-cron: '30 4 * * 1'
          pst-cron: '30 5 * * 1'
          triggered-cron: ${{ github.event.schedule }}
          force: ${{ inputs.force }}

      - name: Run weekly summary
        if: steps.prelude.outputs.skip != 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET: ${{ secrets.OKX_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          BTC_REF_PRICE: ${{ vars.BTC_REF_PRICE || '79500' }}
        run: python3 scripts/weekly_summary.py

      - name: Rebuild dashboard
        if: steps.prelude.outputs.skip != 'true'
        run: python3 scripts/build_dashboard.py

      - name: Commit snapshot + dashboard if changed
        if: success() && steps.prelude.outputs.skip != 'true'
        run: |
          if [ -n "$(git status --porcelain state/ docs/)" ]; then
            git config user.name "monitor-bot"
            git config user.email "monitor-bot@users.noreply.github.com"
            git add state/weekly_snapshots.json docs/
            git commit -m "state: append weekly snapshot + rebuild dashboard [skip ci]"
            git push
          fi

      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          ntfy-topic: ${{ secrets.NTFY_TOPIC }}
          title: "🚨 周报失败"
