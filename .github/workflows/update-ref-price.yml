name: Update BTC REF Price (30d high)

on:
  schedule:
    - cron: '5 8 * * *'  # 1:05 PT in PDT
    - cron: '5 9 * * *'  # 1:05 PT in PST
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass DST gate'
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: prelude
        uses: ./.github/actions/cron-prelude
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_PAT_VARS: ${{ secrets.GH_PAT_VARS }}
        with:
          pdt-cron: '5 8 * * *'
          pst-cron: '5 9 * * *'
          triggered-cron: ${{ github.event.schedule }}
          force: ${{ inputs.force }}
          required-secrets: 'NTFY_TOPIC,GH_PAT_VARS'

      - name: Update REF
        if: steps.prelude.outputs.skip != 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BTC_REF_PRICE: ${{ vars.BTC_REF_PRICE }}
          GH_TOKEN: ${{ secrets.GH_PAT_VARS || secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_ref_price.py

      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          ntfy-topic: ${{ secrets.NTFY_TOPIC }}
          title: "🚨 REF 自动更新失败"
