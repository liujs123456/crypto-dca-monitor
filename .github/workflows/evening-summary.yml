name: Evening Portfolio Summary

on:
  schedule:
    - cron: '17 3 * * *'  # 20:17 PT in PDT
    - cron: '17 4 * * *'  # 20:17 PT in PST
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass DST gate'
        type: boolean
        default: false

permissions:
  contents: write  # commit state/daily_snapshots.json (for interest delta tracking)

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: prelude
        uses: ./.github/actions/cron-prelude
        with:
          pt-hour: '20'
          pt-minute: '17'
          force: ${{ inputs.force }}

      - name: Run evening summary
        if: steps.prelude.outputs.skip != 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET: ${{ secrets.OKX_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          BTC_REF_PRICE: ${{ vars.BTC_REF_PRICE || '79500' }}
        run: python3 scripts/evening_summary.py

      - name: Commit daily snapshot if changed
        if: success() && steps.prelude.outputs.skip != 'true'
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "monitor-bot"
            git config user.email "monitor-bot@users.noreply.github.com"
            git add state/daily_snapshots.json
            git commit -m "state: append daily snapshot [skip ci]"
            git push
          fi

      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          ntfy-topic: ${{ secrets.NTFY_TOPIC }}
          title: "🚨 晚报失败"
