name: Monthly OKX Health Check

on:
  schedule:
    # Day 1 of every month at 09:13 PT
    - cron: '13 16 1 * *'  # 09:13 PT in PDT (March-Nov)
    - cron: '13 17 1 * *'  # 09:13 PT in PST (Nov-March)
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass DST gate'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: prelude
        uses: ./.github/actions/cron-prelude
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        with:
          pdt-cron: '13 16 1 * *'
          pst-cron: '13 17 1 * *'
          triggered-cron: ${{ github.event.schedule }}
          force: ${{ inputs.force }}
          required-secrets: 'NTFY_TOPIC'

      - name: Run OKX health check
        if: steps.prelude.outputs.skip != 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 scripts/monthly_okx_health.py

      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          ntfy-topic: ${{ secrets.NTFY_TOPIC }}
          title: "🚨 OKX 月度健康检查失败"
