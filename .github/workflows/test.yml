name: tests

on:
  push:
    branches: [main]
    paths:
      - "claude/**"
      - "lib/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "claude/**"
      - "lib/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dev dependencies (hypothesis for property tests)
        run: |
          if [ -f requirements-dev.txt ]; then
            python3 -m pip install --upgrade pip
            python3 -m pip install -r requirements-dev.txt
          fi

      - name: Run cron-script tests (lib + scripts)
        run: |
          if [ -d tests ]; then
            echo "::group::Tests in tests/"
            python3 -m unittest discover -s tests -p "test_*.py" -v
            echo "::endgroup::"
          else
            echo "No tests/ directory; skipping cron-script tests."
          fi

      - name: Run skill tests
        run: |
          set -e
          ran=0
          fail=0
          for dir in claude/skills/*/; do
            if ls "$dir"test_*.py >/dev/null 2>&1; then
              echo "::group::Tests in $dir"
              python3 -m unittest discover -s "$dir" -p "test_*.py" -v || fail=1
              echo "::endgroup::"
              ran=1
            fi
          done
          if [ "$ran" = "0" ]; then
            echo "No test files found under claude/skills/*/test_*.py"
          fi
          exit $fail
