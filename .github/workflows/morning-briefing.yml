name: Morning News Briefing

on:
  schedule:
    # 7:03 AM PDT = 14:03 UTC. Switch to 15:03 UTC when DST ends in November.
    - cron: '3 14 * * *'
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run briefing
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 scripts/morning_briefing.py
