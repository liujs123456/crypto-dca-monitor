name: Morning News Briefing

on:
  schedule:
    # 7:17 AM PDT = 14:17 UTC. Switch to 15:17 UTC when DST ends in November.
    # Avoids :00/:03/:05 minute marks where GH Actions cron is often skipped due to global load spikes.
    - cron: '17 14 * * *'
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run briefing
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 scripts/morning_briefing.py
