name: Morning News Briefing

on:
  schedule:
    - cron: '17 14 * * *'  # 7:17 PT in PDT
    - cron: '17 15 * * *'  # 7:17 PT in PST
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass DST gate'
        type: boolean
        default: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: prelude
        uses: ./.github/actions/cron-prelude
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        with:
          pdt-cron: '17 14 * * *'
          pst-cron: '17 15 * * *'
          triggered-cron: ${{ github.event.schedule }}
          force: ${{ inputs.force }}
          required-secrets: 'NTFY_TOPIC,GROQ_API_KEY'

      - name: Run briefing
        if: steps.prelude.outputs.skip != 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 scripts/morning_briefing.py

      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          ntfy-topic: ${{ secrets.NTFY_TOPIC }}
          title: "🚨 早报失败"
