name: BTC Dip Ladder Monitor

on:
  schedule:
    - cron: '7 */2 * * *'  # every 2h on :07 (avoids GH cron load spikes)
  workflow_dispatch:

permissions:
  contents: write  # commit state/btc_state.json + docs/ back to repo

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No DST gate — runs on the 2h interval regardless of clock

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BTC_REF_PRICE: ${{ vars.BTC_REF_PRICE || '79500' }}
        run: python3 scripts/btc_monitor.py

      - name: Rebuild dashboard
        run: python3 scripts/build_dashboard.py

      - name: Commit state + dashboard if changed
        run: |
          if [ -n "$(git status --porcelain state/ docs/)" ]; then
            git config user.name "monitor-bot"
            git config user.email "monitor-bot@users.noreply.github.com"
            git add state/btc_state.json docs/
            git commit -m "state: update BTC monitor state + dashboard [skip ci]"
            git push
          fi

      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          ntfy-topic: ${{ secrets.NTFY_TOPIC }}
          title: "🚨 BTC Monitor failed"
