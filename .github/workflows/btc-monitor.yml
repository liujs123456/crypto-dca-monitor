name: BTC Dip Ladder Monitor

on:
  schedule:
    - cron: '7 */2 * * *'  # every 2h on the :07 mark UTC
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BTC_REF_PRICE: ${{ vars.BTC_REF_PRICE || '79500' }}
        run: bash scripts/btc_monitor.sh
