name: Cron prelude (DST gate + secret check)
description: |
  Two responsibilities:
    (1) Skip a run when the triggering cron is for the wrong DST half (uses github.event.schedule, not wall clock — robust against GH Actions cron delay).
    (2) Skip a run when required secrets are unset (so a fresh fork or a secrets-less public repo doesn't spam failure notifications).

  Caller MUST checkout the repo before invoking this action. Sets steps.<id>.outputs.skip=true if either gate decides to skip.

inputs:
  pdt-cron:
    description: The cron expression scheduled for PDT season (e.g. '17 14 * * *'). Omit to disable DST gating.
    required: false
  pst-cron:
    description: The cron expression scheduled for PST season (e.g. '17 15 * * *'). Required if pdt-cron is set.
    required: false
  triggered-cron:
    description: The cron string that triggered this run (pass github.event.schedule)
    required: false
    default: ''
  force:
    description: "When 'true', bypasses the DST gate (for workflow_dispatch testing)"
    required: false
    default: 'false'
  required-secrets:
    description: "Comma-separated list of secret env-var names that must be non-empty (caller passes them via the step's env block). If any are unset/empty, the run is skipped (not failed) and a single info message is logged."
    required: false
    default: ''

outputs:
  skip:
    description: "Set to 'true' when either the DST gate or the required-secrets check decided to skip"
    value: ${{ steps.merge.outputs.skip }}

runs:
  using: composite
  steps:
    - name: DST gate
      id: dst
      if: ${{ inputs.pdt-cron != '' && inputs.force != 'true' }}
      shell: bash
      run: |
        if python3 -m lib.dst_gate skip-wrong-slot "${{ inputs.triggered-cron }}" "${{ inputs.pdt-cron }}" "${{ inputs.pst-cron }}"; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Required-secret check
      id: secrets
      if: ${{ inputs.required-secrets != '' && steps.dst.outputs.skip != 'true' }}
      shell: bash
      env:
        REQUIRED: ${{ inputs.required-secrets }}
      run: |
        # Caller must have populated these env vars from secrets in the workflow step env block.
        # Composite actions cannot directly read the secrets context; only env values populated by the caller.
        IFS=',' read -ra NAMES <<< "$REQUIRED"
        missing=()
        for raw in "${NAMES[@]}"; do
          name="$(echo "$raw" | xargs)"  # trim whitespace
          [ -z "$name" ] && continue
          # Indirect lookup: read the env var named $name
          value="${!name:-}"
          if [ -z "$value" ]; then
            missing+=("$name")
          fi
        done
        if [ ${#missing[@]} -gt 0 ]; then
          echo "::notice title=Skipping run::Required secrets unset: ${missing[*]}. Set them in repo Settings → Secrets and variables → Actions, or fork-test with workflow_dispatch."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "All required secrets present."
        fi

    - name: Merge skip signals
      id: merge
      shell: bash
      run: |
        if [ "${{ steps.dst.outputs.skip }}" = "true" ] || [ "${{ steps.secrets.outputs.skip }}" = "true" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi
