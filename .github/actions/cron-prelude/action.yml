name: DST gate
description: Skip a workflow run when the triggering cron is for the wrong DST half of the year. Uses github.event.schedule (the literal cron that fired) instead of wall-clock time, so it's robust against GH Actions cron delay. Caller MUST checkout the repo before invoking this action.

inputs:
  pdt-cron:
    description: The cron expression scheduled for PDT season (e.g. '17 14 * * *')
    required: false
  pst-cron:
    description: The cron expression scheduled for PST season (e.g. '17 15 * * *')
    required: false
  triggered-cron:
    description: The cron string that triggered this run (pass github.event.schedule)
    required: false
    default: ''
  force:
    description: "When 'true', bypasses the DST gate (for workflow_dispatch testing)"
    required: false
    default: 'false'

outputs:
  skip:
    description: "Set to 'true' when the gate decided this run is the wrong DST half"
    value: ${{ steps.gate.outputs.skip }}

runs:
  using: composite
  steps:
    - name: DST gate
      id: gate
      if: ${{ inputs.pdt-cron != '' && inputs.force != 'true' }}
      shell: bash
      run: |
        if python3 -m lib.dst_gate skip-wrong-slot "${{ inputs.triggered-cron }}" "${{ inputs.pdt-cron }}" "${{ inputs.pst-cron }}"; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi
